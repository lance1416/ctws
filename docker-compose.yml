services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ctws}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctws}
      POSTGRES_DB: ${POSTGRES_DB:-ctws}
    ports:
      # Loopback only: host tooling (migrations, local dev) can reach it, the network cannot.
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      # Inside compose the database host is the postgres service, not localhost;
      # this overrides the value from env_file (which stays valid for host tooling).
      DATABASE_URL: postgres://${POSTGRES_USER:-ctws}:${POSTGRES_PASSWORD:-ctws}@postgres:5432/${POSTGRES_DB:-ctws}
      # The e2e suite registers a few hundred users a minute; no production
      # value should allow that, so the DEV stack raises it rather than the default being wrong.
      # `compose.prod.yaml` leaves it at the shipped 60.
      AUTH_CEILING: ${AUTH_CEILING:-100000}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/v1/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'

volumes:
  pgdata:
