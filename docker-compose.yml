services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ctws
      POSTGRES_PASSWORD: ctws
      POSTGRES_DB: ctws
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ctws']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
