services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ctws}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctws}
      POSTGRES_DB: ${POSTGRES_DB:-ctws}
    ports:
      # Loopback only: host tooling (migrations, local dev) can reach it, the network cannot.
      # The host side moves with POSTGRES_PORT when another Postgres already holds 5432.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  # A full dump before the api starts, so the move to the new layout always has a backup to go
  # back to (RFC-001 3.2). Runs on every `up`; fails -> the api does not start.
  backup:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-ctws}
    command:
      - sh
      - -c
      - pg_dump -h postgres -U ${POSTGRES_USER:-ctws} -d ${POSTGRES_DB:-ctws} -Fc -f "/backups/$(date -u +%Y%m%dT%H%M%SZ)-pre-redesign.dump"
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      # A local build is dev; its commit when the shell that builds it says (CTWS_COMMIT).
      args:
        CTWS_VERSION: ${CTWS_VERSION:-dev}
        CTWS_COMMIT: ${CTWS_COMMIT:-}
    env_file: .env
    environment:
      # Inside compose the database host is the postgres service, not localhost;
      # this overrides the value from env_file (which stays valid for host tooling).
      DATABASE_URL: postgres://${POSTGRES_USER:-ctws}:${POSTGRES_PASSWORD:-ctws}@postgres:5432/${POSTGRES_DB:-ctws}
      # The e2e suite registers a few hundred users a minute, so this stack raises the
      # instance-wide sign-in ceiling; `compose.prod.yaml` leaves it at the default.
      AUTH_CEILING: ${AUTH_CEILING:-100000}
      # 出站抓取默认开着 —— 这套栈就是日常在用的那一个。要整个关掉（一个出站请求都不发）
      # 就 READING_UNFURL=false。e2e 不靠这个开关：那些用例粘的是 .invalid 的地址，永远解析不出来。
      READING_UNFURL: ${READING_UNFURL:-true}
      BACKUPS_DIR: /backups
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/v1/health']
      interval: 5s
      timeout: 5s
      retries: 10
      # The data migration runs before it listens: about six minutes on 43,000 workspaces. Until
      # then a failed check is not counted, so `up --wait` waits instead of calling it unhealthy.
      start_period: 15m
    depends_on:
      postgres:
        condition: service_healthy
      backup:
        condition: service_completed_successfully
    volumes:
      - backups:/backups:ro
    ports:
      - '3000:3000'

  # The same app with its clock pinned (`CLOCK_PINNED_AT`), for the e2e specs whose answer depends
  # on what time it is (`apps/web/e2e/*.pinned.spec.ts`): their expectations come from this instant,
  # never from the wall clock. The clock starts here when the container does and runs on, so
  # recreate it before a run. Only with `--profile pinned`.
  api-pinned:
    profiles: ['pinned']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      # A local build is dev; its commit when the shell that builds it says (CTWS_COMMIT).
      args:
        CTWS_VERSION: ${CTWS_VERSION:-dev}
        CTWS_COMMIT: ${CTWS_COMMIT:-}
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ctws}:${POSTGRES_PASSWORD:-ctws}@postgres:5432/${POSTGRES_DB:-ctws}
      AUTH_CEILING: ${AUTH_CEILING:-100000}
      READING_UNFURL: 'false'
      CLOCK_PINNED_AT: '2026-10-22T00:30:00Z'
      BACKUPS_DIR: /backups
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/v1/health']
      interval: 5s
      timeout: 5s
      retries: 10
      # The data migration runs before it listens: about six minutes on 43,000 workspaces. Until
      # then a failed check is not counted, so `up --wait` waits instead of calling it unhealthy.
      start_period: 15m
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - backups:/backups:ro
    ports:
      - '3001:3000'

volumes:
  pgdata:
  backups:
