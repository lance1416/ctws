services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ctws
      POSTGRES_PASSWORD: ctws
      POSTGRES_DB: ctws
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ctws']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      # Inside compose the database host is the postgres service, not localhost;
      # this overrides the value from env_file (which stays valid for host tooling).
      DATABASE_URL: postgres://ctws:ctws@postgres:5432/ctws
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/v1/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'

volumes:
  pgdata:
