name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm test
      - run: pnpm build
      # The production compose file's knobs are not reachable from any test: they are strings
      # that only mean something once Docker has interpolated them. This renders it and
      # checks the two that matter -- the one that is overridable, and the one whose default is
      # the security control it is (guards.ts's ceiling is NOT raised in production).
      - name: compose.prod.yaml renders its auth limits
        env:
          POSTGRES_PASSWORD: rendering-only
          IMAGE: ghcr.io/owner/ctws:v0
        run: |
          # `--env-file /dev/null`: the claim is about THIS FILE's defaults, not about whatever
          # the machine happens to export. A developer's own .env raises the limit to 1000.
          render() { docker compose --env-file /dev/null -f compose.prod.yaml config; }
          render | grep -E 'AUTH_RATE_LIMIT_MAX: "?20"?'
          AUTH_RATE_LIMIT_MAX=77 render | grep -E 'AUTH_RATE_LIMIT_MAX: "?77"?'
          # And the per-connection ceiling is NOT raised in production: it is a security control,
          # and the only place it is loosened is the dev stack the e2e suite runs against.
          ! render | grep -q AUTH_CEILING

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ctws/web exec playwright install --with-deps chromium
      # Same-origin, like production: the api image serves the built web app on :3000 and the
      # e2e drives that one origin. COOKIE_SECURE=false because this is plain http.
      - name: Write .env for the api container
        run: |
          cat > .env <<'ENV'
          PORT=3000
          DATABASE_URL=postgres://ctws:ctws@postgres:5432/ctws
          AUTH_REGISTRATION=open
          COOKIE_SECURE=false
          # Every e2e test registers a user and the runner is a single IP, so the default of 20
          # attempts per minute would fail the suite (and retries would register even more).
          AUTH_RATE_LIMIT_MAX=1000
          ENV
      - run: docker compose up -d --wait postgres
      # Migrations run from the host against the published Postgres port.
      - run: pnpm --filter @ctws/api db:migrate
        env:
          DATABASE_URL: postgres://ctws:ctws@localhost:5432/ctws
      # api-pinned is the same image with its clock pinned: the `*.pinned.spec.ts` run against it.
      # Built as dev from this commit, as the status bar and /health say (CTWS_COMMIT).
      - run: CTWS_COMMIT="${GITHUB_SHA::8}" docker compose --profile pinned up -d --build --wait api api-pinned
      - run: curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:3000/api/v1/health
      - run: curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:3001/api/v1/health
      - run: pnpm --filter @ctws/web e2e
      - if: failure()
        run: docker compose --profile pinned logs api api-pinned
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/test-results/

  # THE IMAGE IS PUBLISHED ONLY FROM A COMMIT WHOSE SUITE PASSED, which is why this job lives in
  # the test workflow instead of a `release.yml` of its own. A second workflow on the same tag push
  # cannot see this one's result: it races the suite and can win. `needs` is a gate that cannot be
  # forgotten.
  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ctws" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # ghcr.io requires a lowercase image name
          images: ${{ steps.image.outputs.name }}
          # Explicit rather than relying on the action's defaults. With type=semver a
          # pre-release tag (v0.1.0-rc.1) publishes only its exact version: it gets no
          # `latest` and no `0.1` alias, so a trial release can never become the tag a
          # server pulls by default.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The tag the image is pushed under is the version it says it is: one name, from git.
          build-args: |
            CTWS_VERSION=${{ github.ref_name }}
            CTWS_COMMIT=${{ steps.image.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
