# Production stack. Deploy: docker compose -f compose.prod.yaml pull && docker compose -f compose.prod.yaml up -d
# See DEPLOY.md. Required in the env file: IMAGE, POSTGRES_PASSWORD. Photos need file storage:
# COMPOSE_PROFILES=storage runs Garage here (DEPLOY.md section 2); without it photos are off.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ctws}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-ctws}
    # No published ports: only the api reaches Postgres, over the compose network.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  # A full dump before the api starts, so the move to the new layout always has a backup to go
  # back to (RFC-001 3.2). Runs on every `up`; fails -> the api does not start.
  backup:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    command:
      - sh
      - -c
      - pg_dump -h postgres -U ${POSTGRES_USER:-ctws} -d ${POSTGRES_DB:-ctws} -Fc -f "/backups/$(date -u +%Y%m%dT%H%M%SZ)-pre-redesign.dump"
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  # Where photos go, only with COMPOSE_PROFILES=storage: Garage on one node, its key and bucket
  # made on first start from the same S3_* values the api signs with. No published ports.
  storage:
    image: dxflrs/garage:v2.5.0
    profiles: ['storage']
    restart: unless-stopped
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    configs:
      - source: garage
        target: /etc/garage.toml
    environment:
      # Empty without the profile, where nothing reads them; with it, Garage refuses to start
      # rather than make a key nobody knows.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-ctws}
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      # The image has no shell; its own CLI answers once the node is up.
      test: ['CMD', '/garage', 'status']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${IMAGE:?IMAGE must be set, e.g. ghcr.io/<owner>/ctws:v1.0.0}
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-ctws}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-ctws}
      AUTH_REGISTRATION: closed
      COOKIE_SECURE: 'true'
      # Per-minute cap on auth endpoints; the app defaults to 20 when unset. Raise it if a shared
      # tunnel IP trips it (DEPLOY.md section 4).
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
      BACKUPS_DIR: /backups
      # File storage for photos. All of bucket and both keys, or none (photos off). The endpoint
      # defaults to the storage service above; set it to R2's or B2's, or set it empty for AWS.
      S3_ENDPOINT: ${S3_ENDPOINT-http://storage:3900}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/v1/health']
      interval: 5s
      timeout: 5s
      retries: 10
      # The data migration runs before it listens: about six minutes on 43,000 workspaces. Until
      # then a failed check is not counted, so `up --wait` waits instead of calling it unhealthy.
      start_period: 15m
    depends_on:
      postgres:
        condition: service_healthy
      backup:
        condition: service_completed_successfully
      # Started first when the profile is on; ignored when it is off. Not waited on as healthy:
      # the api runs without photos while the store is down, rather than not at all.
      storage:
        condition: service_started
        required: false
    volumes:
      - backups:/backups:ro
    ports:
      # Loopback by default, so nothing is reachable off the box. Set API_BIND to this host's
      # LAN address when the tunnel runs elsewhere (e.g. its own LXC) -- see DEPLOY.md section 4.
      - '${API_BIND:-127.0.0.1}:3000:3000'

configs:
  garage:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      replication_factor = 1
      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"

      [s3_api]
      s3_region = "us-east-1"
      api_bind_addr = "[::]:3900"

volumes:
  pgdata:
  backups:
  garage-meta:
  garage-data:
