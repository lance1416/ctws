<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CTWS</title>
    <!-- The chosen theme, before the first paint, so the page does not flash the system scheme
         until React mounts. `try` because a private window throws on localStorage. -->
    <script>
      try {
        var t = localStorage.getItem('ctws:theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
